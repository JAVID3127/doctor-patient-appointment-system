<!DOCTYPE html>
<html>

<head>
    <title>Doctor Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Doctor Login</h1>
        <p>Login to your doctor account</p>
    </header>

    <main>

        <form>

            <input
                type="email"
                placeholder="Doctor Email"
                required
            >

            <br><br>

            <input
                type="password"
                placeholder="Password"
                required
            >

            <br><br>

            <button type="submit">
                Login
            </button>

        </form>

    </main>

</body>

</html>
